name: Daily autopilot

# Every day (UTC; PKT = UTC+5; New York = UTC-5/-4). Odd minutes on purpose: GitHub delays :00 jobs.
#   05:13  kickoff  (10:13 AM PKT)  FREE mode only: starts the Kaggle GPU render (takes a few hours)
#   15:41  reel     (8:41 PM PKT | ~11 AM NY)  free: collect + edit; paid: full production. Then publish.
#   18:11  reel     (11:11 PM PKT)  retry, in case Kaggle was still rendering
#   18:37  post     (11:37 PM PKT | ~1 PM NY)  free: meme still from today's reel; paid: generated image
#   21:23  story    (2:23 AM PKT | ~5 PM NY)   teaser of today's reel
on:
  schedule:
    - cron: "13 5 * * *"
    - cron: "41 15 * * *"
    - cron: "11 18 * * *"
    - cron: "37 18 * * *"
    - cron: "23 21 * * *"
  # Test runs: push a change to triggers/run.json, e.g.
  #   {"what": "kickoff", "free_episode": "EP001", "auto_publish": "false", "daily_date": "test-1"}
  # The run's log (and for test dates, the produced media) is committed to runs/ so it can be read without the Actions UI.
  push:
    branches: [main]
    paths: [triggers/run.json]
  workflow_dispatch:
    inputs:
      what:
        description: "What to run now"
        type: choice
        default: kickoff
        options: [kickoff, reel, post, story, all, status]

permissions:
  contents: write

concurrency:
  group: daily-autopilot
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      PRODUCTION_MODE: ${{ vars.PRODUCTION_MODE || 'free' }}
      TTS_ENGINE: ${{ vars.TTS_ENGINE || 'auto' }}
      FREE_EPISODE: ${{ vars.FREE_EPISODE }}
      AUTO_PUBLISH: ${{ vars.AUTO_PUBLISH || 'true' }}
      VIDEO_MODEL: ${{ vars.VIDEO_MODEL || 'veo-3.1-fast-generate-preview' }}
      IMAGE_MODEL: ${{ vars.IMAGE_MODEL || 'gemini-3.1-flash-image' }}
      TEXT_MODEL: ${{ vars.TEXT_MODEL || 'gemini-flash-latest' }}
      DIALOGUE_MODE: ${{ vars.DIALOGUE_MODE || 'veo' }}
      VIDEO_RES: ${{ vars.VIDEO_RES || '1080p' }}
      GRAPH_VERSION: ${{ vars.GRAPH_VERSION || 'v24.0' }}
    steps:
      - uses: actions/checkout@v4

      - name: Pick job
        id: pick
        run: |
          case "${{ github.event.schedule }}" in
            "13 5 * * *")  W=kickoff ;;
            "41 15 * * *") W=reel ;;
            "11 18 * * *") W=reel ;;
            "37 18 * * *") W=post ;;
            "23 21 * * *") W=story ;;
            *) W="${{ github.event.inputs.what }}" ;;
          esac
          AP="${{ vars.AUTO_PUBLISH || 'true' }}"; FE="${{ vars.FREE_EPISODE }}"; DD=""
          if [ "${{ github.event_name }}" = "push" ]; then
            cp triggers/run.json /tmp/run.json
            W=$(jq -r '.what // "kickoff"' /tmp/run.json)
            AP=$(jq -r '.auto_publish // "false"' /tmp/run.json)
            FE=$(jq -r '.free_episode // ""' /tmp/run.json)
            DD=$(jq -r '.daily_date // ""' /tmp/run.json)
          fi
          { echo "what=$W"; echo "auto_publish=$AP"; echo "free_episode=$FE"; echo "daily_date=$DD"; } >> "$GITHUB_OUTPUT"
          echo "Running: $W (auto_publish=$AP free_episode=$FE daily_date=$DD)"

      # Generated media (images, clips, audio) is not committed; it is cached between runs
      # so a retried reel resumes instead of paying for the same clips again.
      - name: Restore media cache
        uses: actions/cache/restore@v4
        with:
          path: |
            episodes/*/06_Image_Assets
            episodes/*/08_Video_Assets
            episodes/*/09_Voice_Over
            episodes/*/11_Final_Edited_Video
            episodes/*/12_Thumbnail
            daily/
          key: media-${{ github.run_id }}
          restore-keys: media-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng
          pip install -r pipeline/requirements.txt

      - name: Run
        env:
          AUTO_PUBLISH: ${{ steps.pick.outputs.auto_publish }}
          FREE_EPISODE: ${{ steps.pick.outputs.free_episode }}
          DAILY_DATE: ${{ steps.pick.outputs.daily_date }}
        run: |
          mkdir -p runs
          W="${{ steps.pick.outputs.what }}"
          set -o pipefail
          if [ "$W" = "status" ]; then CMD="python pipeline/free_mode.py status"; else CMD="python pipeline/daily.py $W"; fi
          $CMD 2>&1 | tee "runs/latest-$W.log"

      - name: Keep test outputs in the repo (test dates only)
        if: always() && startsWith(steps.pick.outputs.daily_date, 'test')
        run: |
          D="runs/${{ steps.pick.outputs.daily_date }}"; mkdir -p "$D"
          cp daily/${{ steps.pick.outputs.daily_date }}/*.json daily/${{ steps.pick.outputs.daily_date }}/*.jpg "$D"/ 2>/dev/null || true
          cp episodes/*/11_Final_Edited_Video/*_final.mp4 episodes/*/12_Thumbnail/*_thumbnail.jpg "$D"/ 2>/dev/null || true
          cp episodes/*/QC_REPORT.md "$D"/ 2>/dev/null || true

      - name: Prune old media
        if: always()
        run: |
          find episodes daily -type f \( -name '*.mp4' -o -name '*.png' -o -name '*.jpg' -o -name '*.wav' \) \
               -mtime +3 -not -path 'episodes/EP001_*' -delete 2>/dev/null || true

      - name: Save media cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            episodes/*/06_Image_Assets
            episodes/*/08_Video_Assets
            episodes/*/09_Voice_Over
            episodes/*/11_Final_Edited_Video
            episodes/*/12_Thumbnail
            daily/
          key: media-${{ github.run_id }}

      - name: Commit text outputs (episode json, docs, logs)
        if: always()
        run: |
          git config user.name "studio-bot"
          git config user.email "studio-bot@users.noreply.github.com"
          echo "${{ steps.pick.outputs.what }} finished $(date -u +%FT%TZ) run ${{ github.run_id }}" >> runs/history.txt
          git add -A   # .gitignore keeps generated media out of git
          git diff --cached --quiet || git commit -m "daily ${{ steps.pick.outputs.what }}: $(date -u +%F)"
          git pull --rebase --autostash origin main && git push origin HEAD:main

      - name: Upload today's media for review/download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-${{ steps.pick.outputs.what }}-${{ github.run_id }}
          path: |
            daily/
            episodes/**/11_Final_Edited_Video/*.mp4
            episodes/**/12_Thumbnail/*.jpg
          retention-days: 14
          if-no-files-found: ignore
